[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protonlite"
version = "0.28.0"
description = "MIT-licensed Proton Mail client, and a Proton connector for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "William Wilamo" }]
keywords = ["proton", "protonmail", "email", "hermes", "agent"]
dependencies = [
    "PGPy13>=0.6.1rc1,<0.7",
    "bcrypt>=4.0,<6",
    "requests>=2.28,<3",
]

[project.urls]
Homepage = "https://github.com/Maytrella007/hermes-proton"

[project.scripts]
protonlite = "protonlite.cli:main"

[tool.setuptools]
packages = ["protonlite"]
